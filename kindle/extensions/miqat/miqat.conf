# Edit on the Kindle at /mnt/us/extensions/miqat/miqat.conf

# The miqat server on your LAN. Plain HTTP: the PW1's TLS stack is too old for modern HTTPS.
SERVER_URL="http://192.168.1.50:8080/dash.png"

# Seconds between frames; the countdown and clock are minute-precise.
INTERVAL=60

# Every Nth frame flashes the panel to clear e-ink ghosting.
FULL_REFRESH_EVERY=30

# Front light 0-24, or empty to leave it as is.
FRONTLIGHT=""
